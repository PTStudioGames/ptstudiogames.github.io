<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT Studio Games</title>
<meta name="description" content="PT Studio Games: MultiShot Render, a Blender add-on that batch renders every camera.">
<style>
:root{--bg:#f6f5f2;--fg:#1c1c1e;--muted:#5d5d63;--card:#fff;--line:#e2e0db;--accent:#e2702a}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#ececee;--muted:#a0a0a8;--card:#1e1e22;--line:#2c2c31;--accent:#f08a46}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{padding:56px 0 24px}
header h1{margin:0;font-size:2.2rem;letter-spacing:-.02em}
header p{margin:8px 0 0;color:var(--muted);max-width:640px}
nav.sec{display:flex;gap:20px;margin-top:20px;font-size:.95rem}
nav.sec a{color:var(--fg);text-decoration:none;border-bottom:2px solid var(--accent)}
nav.sec span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin:24px 0 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.card h3{margin:12px 14px 4px;font-size:1.05rem}
.card p{margin:0 14px 14px;color:var(--muted);font-size:.9rem}
.card:hover{border-color:var(--accent)}
.addon{border-top:1px solid var(--line);padding:40px 0}
.addon h2{margin:0;font-size:1.6rem}
.addon .tag{margin:4px 0 16px;color:var(--muted)}
.addon video{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;display:block;margin-bottom:16px}
.addon h4{margin:20px 0 6px}
.addon ul{padding-left:20px;margin:0}
.addon li{margin:4px 0}
.meta{margin-top:18px;font-size:.9rem;color:var(--muted)}
code{font-size:.9em;background:var(--line);padding:1px 4px;border-radius:4px}
footer{padding:32px 0 48px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>PT Studio Games</h1>
  <p>Games, Blender add-ons and asset packs. Our first Blender add-on renders every shot of a scene, each with its own camera, size and frames, in one click.</p>
  <nav class="sec"><a href="#addons">Blender add-ons</a><span>Games — coming later</span><span>Asset packs — coming later</span></nav>
</header>
<h2 id="addons">Blender add-ons</h2>
<!-- {{CARDS}} -->
{{BLOCKS}}
<footer>© 2026 PT Studio Games · <a href="https://github.com/PTStudioGames" style="color:inherit">GitHub</a></footer>
</div>
</body>
</html>
